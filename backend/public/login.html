<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lumora Staff Portal Login</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Libre+Caslon+Text&display=swap" rel="stylesheet"></head><body class="min-h-screen bg-[#101010] text-white grid place-items-center p-6"><main class="w-full max-w-md border border-[#a9812f]/40 bg-[#181818] p-8"><p class="text-[#d4af37] text-xs uppercase tracking-[.2em]">Lumora DeMoore Properties</p><h1 class="mt-4 font-['Libre_Caslon_Text'] text-4xl">Staff Portal</h1><p class="mt-2 text-white/60">Secure operations workspace</p><form id="loginForm" class="mt-10 space-y-6"><label class="block text-sm text-white/70">Email<input id="email" required type="email" class="mt-2 w-full border-0 border-b border-white/30 bg-transparent px-0 py-3 text-white outline-none focus:border-[#d4af37]" placeholder="bernard@lumoraproperties.com"></label><label class="block text-sm text-white/70">Password<input id="password" required type="password" class="mt-2 w-full border-0 border-b border-white/30 bg-transparent px-0 py-3 text-white outline-none focus:border-[#d4af37]"></label><button class="w-full bg-[#d4af37] px-5 py-3 font-semibold uppercase tracking-wider text-black" type="submit">Sign in</button><p id="status" class="text-sm" role="status"></p></form></main><script>const api=window.LUMORA_API_URL||'';document.getElementById('loginForm').addEventListener('submit',async event=>{event.preventDefault();const status=document.getElementById('status');status.textContent='Signing in...';try{const response=await fetch(`${api}/api/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Login failed');localStorage.setItem('lumora_token',data.token);localStorage.setItem('lumora_user',JSON.stringify(data.user));location.href='staff_portal_dashboard/code.html'}catch(error){status.textContent=error.message;status.className='text-sm text-red-400'}});</script></body></html>
