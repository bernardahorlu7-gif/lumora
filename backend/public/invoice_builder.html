<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Invoice Builder | Lumora</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Libre+Caslon+Text&display=swap" rel="stylesheet"></head><body class="min-h-screen bg-[#f8f5f1] text-[#1c1b1b] p-6 md:p-12"><main class="mx-auto max-w-4xl"><a href="staff_portal_dashboard/code.html" class="text-[#8c691f] text-sm uppercase tracking-wider">Back to portal</a><h1 class="mt-8 font-['Libre_Caslon_Text'] text-5xl">Create invoice</h1><p class="mt-2 text-black/60">Server-calculated Ghana tax breakdown and PDF generation.</p><form id="invoiceForm" class="mt-10 grid gap-6 bg-white p-6 shadow-sm md:grid-cols-2"><label>Client ID<input name="clientId" required class="mt-2 w-full border-b border-black/30 p-2"></label><label>Project ID<input name="projectId" class="mt-2 w-full border-b border-black/30 p-2"></label><label>Due date<input name="dueDate" type="date" class="mt-2 w-full border-b border-black/30 p-2"></label><label>Markup amount<input name="markupAmount" type="number" min="0" step="0.01" value="0" class="mt-2 w-full border-b border-black/30 p-2"></label><div class="md:col-span-2"><h2 class="font-semibold">Line item</h2><div class="mt-3 grid gap-3 md:grid-cols-4"><input name="description" required placeholder="Description" class="border-b border-black/30 p-2"><input name="unit" value="unit" placeholder="Unit" class="border-b border-black/30 p-2"><input name="quantity" type="number" min="0.001" step="0.001" value="1" class="border-b border-black/30 p-2"><input name="unitPrice" required type="number" min="0" step="0.01" placeholder="Unit price" class="border-b border-black/30 p-2"></div></div><button class="md:col-span-2 bg-[#1c1b1b] p-3 uppercase tracking-wider text-white" type="submit">Create invoice and generate PDF</button><p id="status" class="md:col-span-2" role="status"></p></form></main><script>const token=localStorage.getItem('lumora_token');if(!token)location.href='login.html';const form=document.getElementById('invoiceForm');form.addEventListener('submit',async event=>{event.preventDefault();const status=document.getElementById('status');const data=new FormData(form);const payload={clientId:data.get('clientId'),projectId:data.get('projectId')||null,dueDate:data.get('dueDate')||null,markupAmount:Number(data.get('markupAmount')),items:[{description:data.get('description'),unit:data.get('unit'),quantity:Number(data.get('quantity')),unitPrice:Number(data.get('unitPrice'))}]};try{status.textContent='Calculating invoice...';const base=window.LUMORA_API_URL||'';const created=await fetch(`${base}/api/invoices`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify(payload)});const invoice=await created.json();if(!created.ok)throw Error(invoice.error||'Unable to create invoice');const pdf=await fetch(`${base}/api/invoices/${invoice.id}/generate-pdf`,{method:'POST',headers:{Authorization:`Bearer ${token}`}});const result=await pdf.json();if(!pdf.ok)throw Error(result.error||'Unable to generate PDF');status.innerHTML=`Invoice ${invoice.invoice_number} created. <a class="text-[#8c691f] underline" href="${base}${result.downloadUrl}" target="_blank">Download PDF</a>`;form.reset()}catch(error){status.textContent=error.message;status.className='md:col-span-2 text-red-700'}});</script></body></html>
