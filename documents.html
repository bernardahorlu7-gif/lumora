<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Documents | Lumora Staff Portal</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Libre+Caslon+Text&display=swap" rel="stylesheet"><script src="https://unpkg.com/docx-preview@0.3.3/dist/docx-preview.js"></script></head>
<body class="min-h-screen bg-[#f8f5f1] text-[#1c1b1b] p-6 md:p-12"><main class="mx-auto max-w-5xl"><a href="staff_portal_dashboard/code.html" class="text-[#8c691f] text-sm uppercase tracking-wider">Back to portal</a><h1 class="mt-8 font-['Libre_Caslon_Text'] text-5xl">Documents</h1><p class="mt-2 text-black/60">Upload and review contracts, invoices, drawings, and project files.</p>
<section class="mt-10 bg-white p-6 shadow-sm"><form id="uploadForm" class="grid gap-4 md:grid-cols-4"><input name="projectId" required placeholder="Project UUID" class="border-b border-black/30 p-2"><input name="clientId" placeholder="Client UUID" class="border-b border-black/30 p-2"><select name="category" class="border-b border-black/30 p-2"><option value="contract">Contract</option><option value="invoice">Invoice</option><option value="drawing">Drawing</option><option value="general">General</option></select><input name="file" required type="file" class="p-2"><button class="md:col-span-4 bg-[#1c1b1b] p-3 uppercase tracking-wider text-white" type="submit">Upload document</button></form><p id="status" class="mt-4" role="status"></p></section>
<section class="mt-8 bg-white p-6 shadow-sm"><h2 class="font-semibold">Contract library</h2><div id="documents" class="mt-4 space-y-3"><p class="text-black/50">Loading documents...</p></div></section><section id="previewPanel" class="mt-8 hidden bg-white p-6 shadow-sm"><div class="flex items-center justify-between"><h2 id="previewTitle" class="font-semibold">Preview</h2><button id="closePreview" class="text-[#8c691f] uppercase text-sm">Close</button></div><iframe id="pdfPreview" class="mt-4 hidden h-[70vh] w-full border" title="PDF preview"></iframe><div id="docxPreview" class="mt-4 overflow-auto"></div></section></main>
<script>
const token=localStorage.getItem('lumora_token');if(!token)location.href='login.html';const base=window.LUMORA_API_URL||'';const auth={Authorization:`Bearer ${token}`};const status=document.getElementById('status');const list=document.getElementById('documents');const esc=value=>String(value||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){try{const response=await fetch(`${base}/api/documents?category=contract`,{headers:auth});const docs=await response.json();if(!response.ok)throw Error(docs.error||'Unable to load documents');list.innerHTML=docs.length?docs.map(doc=>`<div class="flex flex-wrap items-center justify-between gap-3 border-b border-black/10 py-3"><span>${esc(doc.file_name)}</span><span class="flex gap-3"><button class="preview text-[#8c691f] uppercase text-xs" data-id="${doc.id}" data-name="${esc(doc.file_name)}" data-type="${esc(doc.mime_type)}">Preview</button><button class="download text-[#8c691f] uppercase text-xs" data-id="${doc.id}" data-name="${esc(doc.file_name)}">Download</button></span></div>`).join(''):'<p class="text-black/50">No contracts uploaded yet.</p>';document.querySelectorAll('.preview').forEach(button=>button.addEventListener('click',()=>preview(button.dataset.id,button.dataset.name,button.dataset.type)));document.querySelectorAll('.download').forEach(button=>button.addEventListener('click',()=>download(button.dataset.id,button.dataset.name)));}catch(error){list.innerHTML=`<p class="text-red-700">${esc(error.message)}</p>`}}
async function download(id,name){const response=await fetch(`${base}/api/documents/${id}/download`,{headers:auth});if(!response.ok){status.textContent='Unable to download this document.';return}const url=URL.createObjectURL(await response.blob());const link=document.createElement('a');link.href=url;link.download=name;link.click();URL.revokeObjectURL(url)}
async function preview(id,name,type){const panel=document.getElementById('previewPanel');const pdf=document.getElementById('pdfPreview');const docx=document.getElementById('docxPreview');document.getElementById('previewTitle').textContent=name;panel.classList.remove('hidden');pdf.classList.add('hidden');docx.innerHTML='<p>Loading preview...</p>';const response=await fetch(`${base}/api/documents/${id}/preview`,{headers:auth});const blob=await response.blob();if(type==='application/pdf'){pdf.src=URL.createObjectURL(blob);pdf.classList.remove('hidden');docx.innerHTML='';return}if(type.includes('wordprocessingml.document')||name.toLowerCase().endsWith('.docx')){docx.innerHTML='';await window.docx.renderAsync(await blob.arrayBuffer(),docx);return}docx.innerHTML='<p>This file type cannot be previewed in the browser. Use Download.</p>'}
document.getElementById('uploadForm').addEventListener('submit',async event=>{event.preventDefault();const data=new FormData(event.target);try{status.textContent='Uploading...';const response=await fetch(`${base}/api/documents`,{method:'POST',headers:auth,body:data});const body=await response.json();if(!response.ok)throw Error(body.error||'Upload failed');status.textContent='Document uploaded successfully.';event.target.reset();load()}catch(error){status.textContent=error.message;status.className='mt-4 text-red-700'}});document.getElementById('closePreview').onclick=()=>document.getElementById('previewPanel').classList.add('hidden');load();
</script></body></html>
